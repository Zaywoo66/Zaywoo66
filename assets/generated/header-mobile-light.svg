<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 190" role="img" aria-labelledby="title desc">
<title id="title">Alikhan — full-stack developer</title>
<desc id="desc">React, FastAPI and PostgreSQL connected by a request and response flow.</desc>
<style>svg{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@keyframes mobile-out-a{0%{transform:translate(100px,135px);opacity:1}24%{transform:translate(146px,135px);opacity:1}25%,100%{opacity:0}}
@keyframes mobile-out-b{0%,24%{opacity:0}25%{transform:translate(228px,135px);opacity:1}49%{transform:translate(275px,135px);opacity:1}50%,100%{opacity:0}}
@keyframes mobile-back-b{0%,49%{opacity:0}50%{transform:translate(275px,135px);opacity:1}74%{transform:translate(228px,135px);opacity:1}75%,100%{opacity:0}}
@keyframes mobile-back-a{0%,74%{opacity:0}75%{transform:translate(146px,135px);opacity:1}99%{transform:translate(100px,135px);opacity:1}100%{opacity:0}}
@keyframes mobile-api-pulse{0%,23%,27%,73%,77%,100%{opacity:0}25%,75%{opacity:.75}}
@keyframes mobile-db-pulse{0%,48%,52%,100%{opacity:0}50%{opacity:.75}}
@keyframes mobile-react-pulse{0%,97%,100%{opacity:0}99%{opacity:.75}}
.p1{animation:mobile-out-a 7s linear infinite}.p2{animation:mobile-out-b 7s linear infinite}
.p3{animation:mobile-back-b 7s linear infinite}.p4{animation:mobile-back-a 7s linear infinite}
.api-ring{animation:mobile-api-pulse 7s linear infinite}
.db-ring{animation:mobile-db-pulse 7s linear infinite}
.react-ring{animation:mobile-react-pulse 7s linear infinite}
@media (prefers-reduced-motion:reduce){.packet,.ring{animation:none!important;opacity:0!important}}</style>
<defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#f5f7ff"/><stop offset="1" stop-color="#087f82" stop-opacity=".19"/></linearGradient>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#18223d" stroke-opacity=".08"/></pattern></defs>
<rect width="375" height="190" rx="18" fill="url(#background)"/><rect width="375" height="190" rx="18" fill="url(#grid)"/>
<text x="18" y="39" fill="#18223d" font-size="26" font-weight="650">Alikhan</text>
<text x="18" y="65" fill="#18223d" opacity=".85" font-size="13">Full-stack: Python/FastAPI · React/TypeScript</text>
<text x="18" y="84" fill="#18223d" opacity=".56" font-size="11">Astana, Kazakhstan</text>
<path d="M100 135h46m82 0h47" fill="none" stroke="#087f82" stroke-opacity=".6" stroke-width="2"/>
<g class="packet p1" fill="#087f82"><circle r="4"/></g><g class="packet p2" fill="#087f82"><circle r="4"/></g>
<g class="packet p3" fill="#9b5b11"><circle r="3"/></g><g class="packet p4" fill="#9b5b11"><circle r="3"/></g>
<g fill="#f5f7ff" fill-opacity=".8" stroke="#18223d" stroke-opacity=".28"><rect x="18" y="106" width="82" height="58" rx="10"/>
<rect x="146" y="106" width="82" height="58" rx="10"/><rect x="275" y="106" width="82" height="58" rx="10"/></g>
<g fill="none" stroke-width="2.5"><path d="M47 119h12l6 7-6 7H47l-6-7z" stroke="#087f82"/>
<path d="M174 120h21m-21 6h16" stroke="#ae397e" stroke-linecap="round"/>
<ellipse cx="312" cy="123" rx="13" ry="4" stroke="#9b5b11"/><path d="M299 123v10c0 5 26 5 26 0v-10" stroke="#9b5b11"/></g>
<g fill="#18223d" font-size="11" font-weight="600"><text x="40" y="151">React</text>
<text x="166" y="151">FastAPI</text><text x="282" y="151">PostgreSQL</text></g>
<g class="ring react-ring" fill="none" stroke="#087f82" stroke-width="2"><rect x="16" y="104" width="86" height="62" rx="12"/></g>
<g class="ring api-ring" fill="none" stroke="#ae397e" stroke-width="2"><rect x="144" y="104" width="86" height="62" rx="12"/></g>
<g class="ring db-ring" fill="none" stroke="#9b5b11" stroke-width="2"><rect x="273" y="104" width="86" height="62" rx="12"/></g></svg>
