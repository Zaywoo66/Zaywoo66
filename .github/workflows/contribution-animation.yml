name: Update profile graphics

on:
  push:
    branches: [main]
    paths-ignore:
      - assets/generated/**
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-graphics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'Zaywoo66/Zaywoo66'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test and generate owned graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m unittest discover -s tests -v
          python scripts/generate_profile_svg.py generate --directory assets/generated

      - name: Commit changed graphics without retriggering this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated
          if ! git diff --cached --quiet; then
            git commit -m 'Update public profile graphics'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Render arcade contribution graph
        uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a
        with:
          github_user_name: Zaywoo66
          games: pacman
          hide_month_labels: 'true'

      - name: Publish CSS motion and static contribution variants
        run: python scripts/generate_profile_svg.py patch-pacman --directory dist

      - name: Publish generated SVG
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
